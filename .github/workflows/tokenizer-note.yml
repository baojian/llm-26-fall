name: Tokenizer statistics and note

on:
  pull_request:
    paths:
      - '.github/workflows/tokenizer-note.yml'
      - 'docs/model-tokenizer-statistics/**'
      - 'scripts/*tokenizer*.py'
      - 'scripts/*hf_tokenizer*.py'
      - 'scripts/check-tokenizer-note.mjs'
      - 'tests/test*tokenizer*.py'
      - 'slides/package.json'
      - 'slides/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokenizer-note:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Check measurements, selection, grouping, and snapshot integrity
        run: |
          uv run --no-project --python 3.11 --with pytest==9.1.1 python -m pytest -q tests/test_llm_tokenizer_statistics.py tests/test_hf_tokenizer_catalog.py tests/test_tokenizer_catalog_analysis.py tests/test_tokenizer_note.py
          uv run --no-project --python 3.11 python scripts/llm_tokenizer_statistics.py check
      - name: Verify reproducible figures and standalone reader
        run: uv run --no-project --python 3.11 --with matplotlib==3.11.1 python scripts/build_tokenizer_note.py --check
      - name: Regenerate the corrected broad-catalog figures
        run: |
          mkdir -p workspace/tokenizer-ci
          unzip -p docs/model-tokenizer-statistics/snapshots/2026-10-31/catalog.zip model-catalog.json > workspace/tokenizer-ci/model-catalog.json
          uv run --no-project --python 3.11 --with matplotlib==3.11.1 python scripts/plot_hf_tokenizer_catalog.py --catalog workspace/tokenizer-ci/model-catalog.json --output-dir workspace/tokenizer-ci/figures
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --prefix slides
      - run: npm --prefix slides run browser:install -- --with-deps
      - name: Verify offline reader, downloads, and mobile layout
        run: node scripts/check-tokenizer-note.mjs
      - name: Save the reader and figure previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokenizer-note-and-figures
          path: |
            docs/model-tokenizer-statistics/foundation-models.html
            workspace/tokenizer-ci/figures
            workspace/tokenizer-note-check/*.png
          retention-days: 14
