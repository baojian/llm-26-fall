name: Task feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback:
    name: Public task feedback
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Test definitions and the runner always come from the trusted base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install the public checker dependency
        run: python -m pip install pytest==9.1.1
      - name: Fetch the PR without checking out its code
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/task-feedback"
      - name: Check the student's submission and write feedback
        run: |
          python scripts/task_feedback.py --event "$GITHUB_EVENT_PATH" \
            --summary "$RUNNER_TEMP/task-feedback/feedback.md"
      - name: Publish feedback even when a submission fails
        if: ${{ !cancelled() }}
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CHECKER_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/task-feedback"
          report="$RUNNER_TEMP/task-feedback/feedback.md"
          if [ ! -f "$report" ]; then
            printf '## Task feedback\n\nFeedback could not run. Check the failed setup or fetch step; no submission result is available.\n' > "$report"
          fi
          printf '\nSubmission commit: `%s`. Public checker commit: `%s`.\n' "$PR_HEAD" "$CHECKER_COMMIT" >> "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Save the student's feedback report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-feedback-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/task-feedback/feedback.md
          retention-days: 14
          if-no-files-found: error

  service:
    name: Feedback service regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Exercise proposed checker changes in a separate job. The feedback job
      # above must continue to use the trusted base, not this PR's test files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Test feedback, task fixtures, and submission commands
        run: |
          python -m pytest -q tests/test_task_feedback.py tests/test_l01_tasks.py tests/test_tasks_tool.py \
            --junitxml="$RUNNER_TEMP/task-service-results.xml"
      - name: Save feedback service test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-feedback-service-results
          path: ${{ runner.temp }}/task-service-results.xml
          retention-days: 14
