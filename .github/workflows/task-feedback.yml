name: Task feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback:
    name: Public task feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Test definitions and the runner always come from the trusted base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install the public checker dependency
        run: python -m pip install pytest==9.1.1
      - name: Fetch the PR without checking out its code
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/task-feedback"
      - name: Check the student's submission and write feedback
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f scripts/task_feedback.py ]; then
            echo 'Task feedback becomes available after its introduction PR is merged into the base branch.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/task_feedback.py --event "$GITHUB_EVENT_PATH"
      - name: Test the feedback service
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest tests/test_task_feedback.py -q
