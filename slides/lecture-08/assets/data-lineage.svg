<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>A source record remains traceable through the training pipeline</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="143.0" y="72.0" font-size="32" text-anchor="middle" fill="#20578c">1  Extract</text><rect x="8" y="115" width="270" height="140" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="143.0" y="175.5" font-size="30" text-anchor="middle" fill="#20578c">Source + revision</text><text x="143.0" y="213.0" font-size="30" text-anchor="middle" fill="#20578c">Document ID</text><path d="M280,185 L292,185" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="430.0" y="72.0" font-size="32" text-anchor="middle" fill="#634185">2  Curate</text><rect x="295" y="115" width="270" height="140" fill="#eef2f5" stroke="#634185" stroke-width="2"/><text x="430.0" y="175.5" font-size="30" text-anchor="middle" fill="#634185">Normalize + filter</text><text x="430.0" y="213.0" font-size="30" text-anchor="middle" fill="#634185">Candidate matches</text><path d="M567,185 L579,185" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="717.0" y="72.0" font-size="32" text-anchor="middle" fill="#28673f">3  Split</text><rect x="582" y="115" width="270" height="140" fill="#eef2f5" stroke="#28673f" stroke-width="2"/><text x="717.0" y="175.5" font-size="30" text-anchor="middle" fill="#28673f">Family + source ID</text><text x="717.0" y="213.0" font-size="30" text-anchor="middle" fill="#28673f">Train / dev / test</text><path d="M854,185 L866,185" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="1004.0" y="72.0" font-size="32" text-anchor="middle" fill="#20578c">4  Sample</text><rect x="869" y="115" width="270" height="140" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="1004.0" y="175.5" font-size="30" text-anchor="middle" fill="#20578c">Token weights</text><text x="1004.0" y="213.0" font-size="30" text-anchor="middle" fill="#20578c">Processed budget</text><text x="575.0" y="342.0" font-size="32" text-anchor="middle" fill="#142e4b">Keep provenance and audit counts at every stage.</text><text x="575.0" y="385.0" font-size="30" text-anchor="middle" fill="#566471">External benchmarks keep their published split.</text></g></svg>
