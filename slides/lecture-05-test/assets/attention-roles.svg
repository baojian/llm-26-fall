<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="552" viewBox="0 0 1152 552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="attention-roles-title attention-roles-description"><title id="attention-roles-title">One input, three roles</title><desc id="attention-roles-description">The four input embeddings are reused without projection. For the word “the”, the query is x_3. Each x_j is used as both a key for comparison and a value in the weighted sum. The next step introduces learned projections for the three roles. The input embeddings themselves may already be trainable.</desc><defs ><marker id="attention-roles-query-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7550b6" stroke-width="1.8"></path></marker><marker id="attention-roles-key-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#436eae" stroke-width="1.8"></path></marker><marker id="attention-roles-value-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#147d73" stroke-width="1.8"></path></marker></defs><text x="2" y="360" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">Input</text><text x="2" y="402" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">embeddings</text><rect x="236" y="327" width="680" height="101" fill="#eef3fa" rx="12"></rect><rect x="294" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="313" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="332" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="351" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><text x="330" y="406" fill="#142e4b" font-size="30" text-anchor="middle" font-weight="400">Bank</text><rect x="458" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="477" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="496" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="515" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><text x="494" y="406" fill="#142e4b" font-size="30" text-anchor="middle" font-weight="400">of</text><rect x="622" y="348" width="15" height="20" fill="#7550b6" rx="3"></rect><rect x="641" y="348" width="15" height="20" fill="#7550b6" rx="3"></rect><rect x="660" y="348" width="15" height="20" fill="#7550b6" rx="3"></rect><rect x="679" y="348" width="15" height="20" fill="#7550b6" rx="3"></rect><text x="658" y="406" fill="#7550b6" font-size="30" text-anchor="middle" font-weight="400">the</text><rect x="786" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="805" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="824" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><rect x="843" y="348" width="15" height="20" fill="#436eae" rx="3"></rect><text x="822" y="406" fill="#142e4b" font-size="30" text-anchor="middle" font-weight="400">river</text><g class="fragment custom" data-fragment-index="0" data-animation-object="attention-roles-0"><g data-appear="" visibility="visible"><path d="M 576 326 V 282" fill="none" stroke="#bccbd7" stroke-width="2.5"></path><g data-attention-role="query"><rect x="4" y="5" width="360" height="230" fill="#f2edfa" rx="12"></rect><text x="184" y="48" fill="#7550b6" font-size="34" text-anchor="middle" font-weight="600">Query</text><foreignObject x="20" y="67" width="328" height="76" font-size="36" color="#7550b6" data-math-box=""><div xmlns="http://www.w3.org/1999/xhtml" class="attention-math" data-align="middle" data-tex="q_3=x_3"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>q</mi><mn>3</mn></msub><mo>=</mo><msub><mi>x</mi><mn>3</mn></msub></mrow><annotation encodin