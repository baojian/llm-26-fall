0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></div></foreignObject><text x="576" y="175" fill="#142e4b" font-size="30" text-anchor="middle" font-weight="400">Compared with</text><text x="576" y="215" fill="#142e4b" font-size="30" text-anchor="middle" font-weight="400">the query</text><path d="M 576 282 H 576 V 240" fill="none" stroke="#436eae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#attention-roles-key-arrow)"></path></g><g data-attention-role="value"><rect x="788" y="5" width="360" height="230" fill="#edf7f5" rx="12"></rect><text x="968" y="48" fill="#147d73" font-size="34" text-anchor="middle" font-weight="600">Value</text><foreignObject x="804" y="67" width="328" height="76" font-size="36" color="#147d73" data-math-box=""><div xmlns="http://www.w3.org/1999/xhtml" class="attention-math" data-align="middle" data-tex="v_j=x_j"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mi>j</mi></msub><mo>=</mo><msub><mi>x</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">v_j=x_j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3