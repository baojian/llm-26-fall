<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="552" viewBox="0 0 1152 552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="context-intuition-title context-intuition-description"><title id="context-intuition-title">Context for a token</title><desc id="context-intuition-description">In “Noa can be annoying but she is a great cat”, the pronoun she refers to Noa. At she, causal attention can use Noa through she and masks is, a, great, and cat. The link is an illustrative linguistic relation. The model computes a weighted context over available value vectors.</desc><defs ><marker id="context-intuition-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#147d73" stroke-width="1.8"></path></marker></defs><text x="2" y="37" fill="#142e4b" font-size="32" text-anchor="start" font-weight="400">Which earlier word helps interpret “she”?</text><text x="65" y="166" fill="#142e4b" font-size="38" text-anchor="middle" font-weight="400" data-token-position="1" data-token-visibility="available">Noa</text><text x="165" y="166" fill="#142e4b" font-size="38" text-anchor="middle" font-weight="400" data-token-position="2" data-token-visibility="available">can</text><text x="257" y="166" fill="#142e4b" font-size="38" text-anchor="middle" font-weight="400" data-token-position="3" data-token-visibility="available">be</text><text x="400" y="166" fill="#142e4b" font-size="38" text-anchor="middle" font-weight="400" data-token-position="4" data-token-visibility="available">annoying</text><text x="542" y="166" fill="#142e4b" font-size="38" text-anchor="middle" font-weight="400" data-token-position="5" data-token-visibility="available">but</text><text x="650" y="166" fill="#7550b6" font-size="38" text-anchor="middle" font-weight="600" data-token-position="6" data-token-visibility="available">she</text><text x="748" y="166" fill="#8493a1" font-size="38" text-anchor="middle" font-weight="400" data-token-position="7" data-token-visibility="future">is</text><text x="818" y="166" fill="#8493a1" font-size="38" text-anchor="middle" font-weight="400" data-token-position="8" data-token-visibility="future">a</text><text x="927" y="166" fill="#8493a1" font-size="38" text-anchor="middle" font-weight="400" data-token-position="9" data-token-visibility="future">great</text><text x="1078" y="166" fill="#8493a1" font-size="38" text-anchor="middle" font-weight="400" data-token-position="10" data-token-visibility="future">cat</text><path d="M 614 182 H 686" fill="none" stroke="#7550b6" stroke-width="3" stroke-linecap="round"></path><g class="fragment custom" data-fragment-index="0" data-animation-object="context-intuition-0"><g data-appear="" visibility="visible"><path d="M 29 182 H 101" fill="none" stroke="#147d73" stroke-width="3" stroke-linecap="round"></path><path d="M 646 194 C 573 299 144 299 70 194" fill="none" stroke="#147d73" stroke-width="3" stroke-linecap="round" marker-end="url(#context-intuition-arrow)" data-referent-link=""></path><text x="357" y="309" fill="#147d73" font-size="32" text-anchor="middle" font-weight="400">“she” refers to Noa</text><text x="2" y="547" fill="#526374" font-size="24" text-anchor="start" font-weight="400">Illustrative linguistic relation</text></g></g><g class="fragment custom" data-fragment-index="1" data-animation-object="context-intuition-1"><g data-appear="" visibility="visible"><path d="M 707 118 V 194" fill="none" stroke="#bccbd7" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 6" data-causal-boundary=""></path><path d="M 724 116 V 97 H 1126 V 116" fill="none" stroke="#8493a1" stroke-width="3" stroke-linecap="round"></path><text x="925" y="80" fill="#526374" font-size="27" text-anchor="middle" font-weight="400">Future positions: masked</text><text x="753" y="255" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">At “she”, GPT uses</text><text x="753" y="297" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">the available prefix.</text></g></g><g class="fragment custom" data-fragment-index="2" data-animation-object="context-intuition-2"><g data-appear="" visibility="visible"><text x="2" y="391" fill="#142e4b" font-size="32" text-anchor="start" font-weight="600">Build a context vector for this position</text><foreignObject x="2" y="412" width="510" height="110" font-size="36" color="#142e4b" data-math-box=""><div xmlns="http://www.w3.org/1999/xhtml" class="attention-math" data-align="start" data-tex="z_t=\sum_{j\le t}\alpha_{t,j}v_j"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>z</mi><mi>t</mi></msub><mo>=</mo><msub><mo>∑</mo><mrow><mi>j</mi><mo>≤</mo><mi>t</mi></mrow></msub><msub><mi>α</mi><mrow><mi>t</mi><mo separator="true">,</mo><mi>j</mi></mrow></msub><msub><mi>v</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">z_t=\sum_{j\le t}\alpha_{t,j}v_j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.044em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.1858em;vertical-align:-0.4358em;"></span><span class="mop"><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.162em;"><span style="top:-2.4003em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span><span class="mrel mtight">≤</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.4358em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0037em;">α</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0037em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mpunct mtight">,</span><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></div></foreignObject><text x="574" y="451" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">Learn weights over the</text><text x="574" y="493" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">available value vectors.</text></g></g></svg>
