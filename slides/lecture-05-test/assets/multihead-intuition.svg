<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="552" viewBox="0 0 1152 552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="multihead-intuition-title multihead-intuition-description"><title id="multihead-intuition-title">Why use multiple heads?</title><desc id="multihead-intuition-description">An invented causal example at the last token of “I gave my dog Charlie some food”. Three heads have distinct normalized rows over the same seven available positions, emphasizing I, Charlie, and food. The questions who, to whom, and what illustrate possible relations. Real heads learn their behavior and may overlap. Each head uses its own projected query, keys, and values; the example displays only the attention weights.</desc><text x="2" y="35" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">Query at “food”: all seven positions are available.</text><rect x="1002" y="74" width="124" height="54" fill="#f2edfa" rx="10"></rect><text x="2" y="546" fill="#526374" font-size="30" text-anchor="start" font-weight="400">Invented weights; learned heads may have overlapping roles.</text><text x="272" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="1" data-token-visibility="available">I</text><text x="404" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="2" data-token-visibility="available">gave</text><text x="536" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="3" data-token-visibility="available">my</text><text x="668" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="4" data-token-visibility="available">dog</text><text x="800" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="5" data-token-visibility="available">Charlie</text><text x="932" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="6" data-token-visibility="available">some</text><text x="1064" y="112" fill="#7550b6" font-size="32" text-anchor="middle" font-weight="600" data-token-position="7" data-token-visibility="available">food</text><g class="fragment custom" data-fragment-index="0" data-animation-object="multihead-intuition-0"><g data-appear="" visibility="visible"><g data-illustrative-head="1" data-query-position="7"><text x="2" y="179" fill="#7550b6" font-size="30" text-anchor="start" font-weight="600">Head 1</text><text x="2" y="216" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">Who?</text><rect x="215" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="215" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.7"></rect><text x="272" y="197" fill="#ffffff" font-size="32" text-anchor="middle" font-weight="600" data-attention-weight="0.7" data-key-position="1">0.70</text><rect x="347" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="347" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.08"></rect><text x="404" y="197" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-attention-weight="0.08" data-key-position="2">0.08</text><rect x="479" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="479" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.03"></rect><text x="536" y="197" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-attention-weight="0.03" data-key-position="3">0.03</text><rect x="611" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="611" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.04"></rect><text x="668" y="197" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-attention-weight="0.04" data-key-position="4">0.04</text><rect x="743" y="153" width="114" height="66" fill="#