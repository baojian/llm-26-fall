<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="552" viewBox="0 0 1152 552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="mha-architecture-title mha-architecture-description"><title id="mha-architecture-title">Where multi-head attention is used</title><desc id="mha-architecture-description">The original encoder-decoder has encoder self-attention, causal decoder self-attention, and cross-attention to encoder outputs. The GPT-style decoder uses causal self-attention within one prefix. Read upward. Residual connections and normalization are omitted to isolate attention paths.</desc><defs ><marker id="mha-architecture-arrow-142e4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#142e4b" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-526374" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#526374" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-bccbd7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#bccbd7" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-e5edf3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#e5edf3" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-527596" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#527596" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-7550b6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7550b6" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-eee8f7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#eee8f7" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-147d73" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#147d73" stroke-width="1.8"></path></marker><marker id="mha-architecture-arrow-e5f3ef" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#e5f3ef" stroke-width="1.8"></path></marker></defs><text x="308" y="32" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="600">2017 encoder–decoder</text><path d="M 651 8 L 651 509" fill="none" stroke="#e5edf3" stroke-width="2.5"></path><text x="925" y="32" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="600">GPT-style model</text><text x="576" y="546" fill="#526374" font-size="24" text-anchor="middle" font-weight="400">Attention paths only; residuals and normalization omitted.</text><g class="fragment custom" data-fragment-index="0" data-animation-object="mha-architecture-0"><g data-appear="" visibility="visible"><rect x="16" y="466" width="225" height="46" fill="#e5edf3" rx="11"></rect><text x="128.5" y="498.8" fill="#142e4b" font-size="28" text-anchor="middle" font-weight="400">Source states</text><path d="M 128 466 L 128 434" fill="none" stroke="#bccbd7" stroke-width="2.5" marker-end="url(#mha-architecture-arrow-bccbd7)"></path><rect x="3" y="238" width="251" height="200" fill="none" rx="11" stroke="#bccbd7" stroke-dasharray="6 5" stroke-width="2"></rect><rect x="16" y="354" width="225" height="76" fill="#e5f3ef" rx="11"></rect><text x="128.5" y="389" fill="#142e4b" font-size="26" text-anchor="middle" font-weight="400">Self-attention</text><text x="128.5" y="420" fill="#142e4b" font-size="26" text-anchor="middle" font-weight="400">all source tokens</text><path d="M 128 354 L 128 316" fill="none" stroke="#bccbd7" stroke-width="2.5" marker-end="url(#mha-architecture-arrow-bccbd7)"></path><rect x="16" y="259" width="225" height="53" fill="#e5edf3" rx="11"></rect><text x="128.5" y="295.3" fill="#142e4b" font-size="28" text-anchor="middle" font-weight="400">Feed-forward</text><path d="M 128 259 L 128 188" fill="none" stroke="#147d73" stroke-width="2.5" marker-end="url(#mha-architecture-arrow-147d73)"></path><text x="128" y="167" fill="#147d73" font-size="27" text-anchor="middle" font-weight="400">Encoder output</text><foreignObject x="175" y="198" width="78" height="40" font-size="25" color="#526374" data-math-box=""><div xmlns="http://www.w3.org/1999/xhtml" class="attention-math" data-align="start" data-tex="\times N"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>×</mo><mi>N</mi></mrow><annotation encoding="application/x-tex">\times N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord">×</span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span></div></foreignObject></g></g><g class="fragment custom" data-fragment-index="1" data-animation-object="mha-architecture-1"><g data-appear="" visibility="visible"><rect x="369" y="466" width="252" height="46" fill="#e5edf3" rx="11"></rect><text x="495" y="498.8" fill="#142e4b" font-size="28" text-anchor="middle" font-weight="400">Target states</text><path d="M 495 466 L 495 434" fill="none" stroke="#bccbd7" stroke-width="2.5" marker-end="url(#mha-architecture-arrow-bccbd7)"></path><rect x="356" y="133" widt