<svg xmlns="http://www.w3.org/2000/svg" width="540" height="410" viewBox="0 0 540 410" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="rope-complex-plane-description"><desc id="rope-complex-plane-description">A pair of real coordinates is represented on a complex plane. The invented query pair for she starts at (1,0) and rotates through 150 degrees at position five with toy frequency pi/6, reaching (-sqrt(3)/2,1/2). Its unit length is unchanged.</desc><defs><marker id="rope-complex-plane-7550b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7550b6" stroke-width="1.8"/></marker><marker id="rope-complex-plane-147d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#147d73" stroke-width="1.8"/></marker></defs><text x="270" y="32" text-anchor="middle" fill="#142e4b" font-size="30">“she” · position 5</text><circle cx="270" cy="204" r="128" fill="none" stroke="#bccbd7" stroke-width="2"/><line x1="75" y1="204" x2="471" y2="204" stroke="#bccbd7" stroke-width="2"/><line x1="270" y1="353" x2="270" y2="56" stroke="#bccbd7" stroke-width="2"/><text x="492" y="212" text-anchor="middle" fill="#526374" font-size="26">Re</text><text x="285" y="63" text-anchor="middle" fill="#526374" font-size="26">Im</text><line x1="270" y1="204" x2="398" y2="204" stroke="#147d73" stroke-width="4" marker-end="url(#rope-complex-plane-147d73)"/><line x1="270" y1="204" x2="159.1487483155919" y2="139.99999999999994" stroke="#7550b6" stroke-width="4" marker-end="url(#rope-complex-plane-7550b6)"/><text x="427" y="245" text-anchor="middle" fill="#147d73" font-size="28">1 + 0i</text><text x="124" y="109" text-anchor="middle" fill="#7550b6" font-size="26">−√3/2 + i/2</text><text x="270" y="383" text-anchor="middle" fill="#526374" font-size="28">150° rotation · same length</text></svg>
