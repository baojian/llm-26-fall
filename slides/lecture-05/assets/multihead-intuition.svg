<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="552" viewBox="0 0 1152 552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="multihead-intuition-title multihead-intuition-description"><title id="multihead-intuition-title">Why use multiple heads?</title><desc id="multihead-intuition-description">An invented causal example at she, position 5 of “Noa can be annoying but she”. Three heads have distinct normalized rows over the same six available positions, emphasizing Noa, annoying, and but. Referent, description, and contrast illustrate possible relations. Real heads learn their behavior and may overlap. Each head uses its own projected query, keys, and values; the example displays only the attention weights.</desc><text x="2" y="35" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">Query: “she” at position 5 · six available positions, 0–5.</text><rect x="1030" y="74" width="124" height="54" fill="#f2edfa" rx="10"></rect><text x="2" y="546" fill="#526374" font-size="30" text-anchor="start" font-weight="400">Invented weights; learned heads may have overlapping roles.</text><text x="352" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="0" data-token="Noa" data-token-visibility="available">Noa</text><text x="500" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="1" data-token="can" data-token-visibility="available">can</text><text x="648" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="2" data-token="be" data-token-visibility="available">be</text><text x="796" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="3" data-token="annoying" data-token-visibility="available">annoying</text><text x="944" y="112" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-token-position="4" data-token="but" data-token-visibility="available">but</text><text x="1092" y="112" fill="#7550b6" font-size="32" text-anchor="middle" font-weight="600" data-token-position="5" data-token="she" data-token-visibility="available">she</text><g class="fragment custom" data-fragment-index="0" data-animation-object="multihead-intuition-0"><g data-appear="" visibility="visible"><g data-illustrative-head="1" data-query-position="5"><text x="2" y="179" fill="#7550b6" font-size="30" text-anchor="start" font-weight="600">Head 1</text><text x="2" y="216" fill="#142e4b" font-size="30" text-anchor="start" font-weight="400">Referent?</text><rect x="295" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="295" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.6"></rect><text x="352" y="197" fill="#ffffff" font-size="32" text-anchor="middle" font-weight="600" data-attention-weight="0.6" data-key-position="0">0.60</text><rect x="443" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="443" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.05"></rect><text x="500" y="197" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-attention-weight="0.05" data-key-position="1">0.05</text><rect x="591" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="591" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.04"></rect><text x="648" y="197" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-attention-weight="0.04" data-key-position="2">0.04</text><rect x="739" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="739" y="153" width="114" height="66" fill="#7550b6" rx="10" fill-opacity="0.1"></rect><text x="796" y="197" fill="#142e4b" font-size="32" text-anchor="middle" font-weight="400" data-attention-weight="0.1" data-key-position="3">0.10</text><rect x="887" y="153" width="114" height="66" fill="#eef3fa" rx="10"></rect><rect x="887" y="153" wi