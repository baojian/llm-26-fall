<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="358" viewBox="0 0 1152 358" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="rope-pair-frequencies-description"><desc id="rope-pair-frequencies-description">One head of width eight has four coordinate pairs. Each supplied query and key pair begins at (1,0). With the standard base 10000, frequencies are 1,0.1,0.01,0.001 radians per token. She at position five rotates by 5,0.5,0.05,0.005 radians. Noa at position zero stays at angle zero in every pair.</desc><defs><marker id="rope-pair-frequencies-7550b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7550b6" stroke-width="1.8"/></marker><marker id="rope-pair-frequencies-147d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#147d73" stroke-width="1.8"/></marker></defs><text x="144" y="31" text-anchor="middle" fill="#142e4b" font-size="28">Coordinates 0–1</text><text x="144" y="75" text-anchor="middle" fill="#526374" font-size="26">θ = 1 rad/token</text><circle cx="144" cy="176" r="73" fill="none" stroke="#bccbd7" stroke-width="2"/><line x1="56" y1="176" x2="232" y2="176" stroke="#bccbd7" stroke-width="2"/><line x1="144" y1="88" x2="144" y2="264" stroke="#bccbd7" stroke-width="2"/><line x1="144" y1="176" x2="217" y2="176" stroke="#147d73" stroke-width="4" marker-end="url(#rope-pair-frequencies-147d73)"/><line x1="144" y1="176" x2="164.70733953881552" y2="246.00147205040912" stroke="#7550b6" stroke-width="4" marker-end="url(#rope-pair-frequencies-7550b6)"/><text x="144" y="284" text-anchor="middle" fill="#7550b6" font-size="28">5θ = 5 rad</text><text x="432" y="31" text-anchor="middle" fill="#142e4b" font-size="28">Coordinates 2–3</text><text x="432" y="75" text-anchor="middle" fill="#526374" font-size="26">θ = 0.1 rad/token</text><circle cx="432" cy="176" r="73" fill="none" stroke="#bccbd7" stroke-width="2"/><line x1="344" y1="176" x2="520" y2="176" stroke="#bccbd7" stroke-width="2"/><line x1="432" y1="88" x2="432" y2="264" stroke="#bccbd7" stroke-width="2"/><line x1="432" y1="176" x2="505" y2="176" stroke="#147d73" stroke-width="4" marker-end="url(#rope-pair-frequencies-147d73)"/><line x1="432" y1="176" x2="496.0635270179972" y2="141.00193568189317" stroke="#7550b6" stroke-width="4" marker-end="url(#rope-pair-frequencies-7550b6)"/><text x="432" y="284" text-anchor="middle" fill="#7550b6" font-size="28">5θ = 0.5 rad</text><text x="720" y="31" text-anchor="middle" fill="#142e4b" font-size="28">Coordinates 4–5</text><text x="720" y="75" text-anchor="middle" fill="#526374" font-size="26">θ = 0.01 rad/token</text><circle cx="720" cy="176" r="73" fill="none" stroke="#bccbd7" stroke-width="2"/><line x1="632" y1="176" x2="808" y2="176" stroke="#bccbd7" stroke-width="2"/><line x1="720" y1="88" x2="720" y2="264" stroke="#bccbd7" stroke-width="2"/><line x1="720" y1="176" x2="793" y2="176" stroke="#147d73" stroke-width="4" marker-end="url(#rope-pair-frequencies-147d73)"/><line x1="720" y1="176" x2="792.9087690088326" y2="172.3515206432405" stroke="#7550b6" stroke-width="4" marker-end="url(#rope-pair-frequencies-7550b6)"/><text x="720" y="284" text-anchor="middle" fill="#7550b6" font-size="28">5θ = 0.05 rad</text><text x="1008" y="31" text-anchor="middle" fill="#142e4b" font-size="28">Coordinates 6–7</text><text x="1008" y="75" text-anchor="middle" fill="#526374" font-size="26">θ = 0.001 rad/token</text><circle cx="1008" cy="176" r="73" fill="none" stroke="#bccbd7" stroke-width="2"/><line x1="920" y1="176" x2="1096" y2="176" stroke="#bccbd7" stroke-width="2"/><line x1="1008" y1="88" x2="1008" y2="264" stroke="#bccbd7" stroke-width="2"/><line x1="1008" y1="176" x2="1081" y2="176" stroke="#147d73" stroke-width="4" marker-end="url(#rope-pair-frequencies-147d73)"/><line x1="1008" y1="176" x2="1080.9990875019012" y2="175.63500152083142" stroke="#7550b6" stroke-width="4" marker-end="url(#rope-pair-frequencies-7550b6)"/><text x="1008" y="284" text-anchor="middle" fill="#7550b6" font-size="28">5θ = 0.005 rad</text><text x="145" y="342" text-anchor="middle" fill="#7550b6" font-size="28">she at 5</text><text x="400" y="342" text-anchor="middle" fill="#147d73" font-size="28">Noa at 0</text><text x="850" y="342" text-anchor="middle" fill="#526374" font-size="26">Supplied pairs: q = k = (1,0)</text></svg>
