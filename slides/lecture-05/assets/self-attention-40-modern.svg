<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 568" width="1152" height="552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="gpt-architecture-title gpt-architecture-description"><title id="gpt-architecture-title">GPT-style causal Transformer</title><desc id="gpt-architecture-description">Read upward from the bottom. Separate token and positional embeddings are added before entering L Transformer blocks. Each block uses layer normalization before causal multi-head attention and before an MLP, with a residual addition after each. Final layer normalization and the language-model head at the top predict the next token. Generation appends that token to the prefix at the bottom and repeats.</desc><defs ><marker id="gpt-arrow-neutral" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 6 4 L 1 7" fill="none" stroke="#bccbd7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="gpt-arrow-teal" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 6 4 L 1 7" fill="none" stroke="#147d73" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><text x="661" y="556" font-size="24" fill="#7550b6" text-anchor="middle" font-weight="400">Noa · can · be · … · she</text><text x="960" y="556" font-size="24" fill="#527596" text-anchor="middle" font-weight="400">0 · 1 · 2 · 3 · 4 · 5</text><g class="fragment custom" data-fragment-index="0" data-animation-object="gpt-embeddings"><g data-appear="" visibility="visible"><g data-explanation-item="Embed the prefix" role="listitem"><circle cx="9" cy="489" r="3.6" fill="#142e4b"></circle><text x="28" y="498" font-size="28" fill="#142e4b" text-anchor="start" font-weight="400">Embed the prefix</text></g><foreignObject x="28" y="504.8" width="394" height="50.4" font-size="28" color="#142e4b" 