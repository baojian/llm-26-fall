<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="552" viewBox="0 0 1152 552" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="tokenizer-inputs-title tokenizer-inputs-description"><title id="tokenizer-inputs-title">From raw text to token embeddings</title><desc id="tokenizer-inputs-description">Left: words, characters, and data-learned subwords. The running Noa prefix uses six toy word tokens Noa, can, be, annoying, but, she, with invented token IDs. Real tokenizers may split these words. Token IDs select learned embeddings. Right: BPE, Unigram, and WordPiece share separate vocabulary-learning and segmentation stages.</desc><defs ><marker id="tokenizer-inputs-arrow-142e4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#142e4b" stroke-width="1.8"></path></marker><marker id="tokenizer-inputs-arrow-526374" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#526374" stroke-width="1.8"></path></marker><marker id="tokenizer-inputs-arrow-bccbd7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#bccbd7" stroke-width="1.8"></path></marker><marker id="tokenizer-inputs-arrow-e5edf3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#e5edf3" stroke-width="1.8"></path></marker><marker id="tokenizer-inputs-arrow-527596" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#527596" stroke-width="1.8"></path></marker><marker id="tokenizer-inputs-arrow-7550b6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth=