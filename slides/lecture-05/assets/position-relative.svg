<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="480" viewBox="0 0 1152 480" font-family="Arial, Helvetica Neue, sans-serif" role="img" aria-labelledby="position-relative-title position-relative-description"><title id="position-relative-title">RoPE encodes the relative offset in a dot product</title><desc id="position-relative-description">Two circles compare the same fixed query for she and key for Noa at positions five and zero, then at hypothetical positions eight and three. Both pairs have offset five and the same dot product. Controls relocate these fixed content vectors.</desc><defs ><marker id="position-relative-arrow-142e4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#142e4b" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-526374" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#526374" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-bccbd7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#bccbd7" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-e5edf3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#e5edf3" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-527596" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#527596" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-7550b6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#7550b6" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-eee8f7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#eee8f7" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-147d73" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#147d73" stroke-width="1.8"></path></marker><marker id="position-relative-arrow-e5f3ef" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#e5f3ef" stroke-width="1.8"></path></marker></defs><text x="2" y="28" fill="#142e4b" font-size="26" text-anchor="start" font-weight="400">Practice E02 · 2 min · Shift both positions. Does the score change?</text><text x="2" y="63" fill="#526374" font-size="24" text-anchor="start" font-weight="400">Fixed toy content: q = k = (1, 0), θ = 30°. Purple: she; teal: Noa.</text><text x="278" y="111" fill="#142e4b" font-size="28" text-anchor="middle" font-weight="600">Running-example positions</text><circle cx="278" cy="237" r="93" fill="none" stroke="#e5edf3" stroke-width="2"></circle><line x1="167" y1="237" x2="393" y2="237" stroke="#bccbd7" stroke-width="2.5" marker-end="url(#position-relative-arrow-bccbd7)"></line><line x1="278" y1="346" x2="278" y2="124" stroke="#bccbd7" stroke-width="2.5" marker-end="url(#position-relative-arrow-bccbd7)"></line><text x="386" y="271" fill="#526374" font-size="24" text-anchor="middle" font-weight="400">1</text><text x="256" y="134" fill="#526374" font-size="24" text-anchor="middle" font-weight="400">1</text><line x1="278" y1="237" x2="197.4596374480472" y2="190.49999999999997" stroke="#7550b6" stroke-width="4" marker-end="url(#position-relative-arrow-7550b6)" data-