<text x="1019.5" y="253.0" font-size="28" text-anchor="middle" fill="#566471">One lookup per ID</text>
<text x="141.0" y="350.0" font-size="30" text-anchor="start" fill="#142e4b">Our two-merge toy vocabulary: token 257 stores the bytes for </text>
