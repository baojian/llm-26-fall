<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>One optimizer update in eight ordered stages</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="20" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="140.0" y="75.5" font-size="30" text-anchor="middle" fill="#20578c">1  Train mode</text><text x="140.0" y="113.0" font-size="30" text-anchor="middle" fill="#20578c">clear gradients</text><path d="M275,85 L292,85" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="20" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="430.0" y="75.5" font-size="30" text-anchor="middle" fill="#20578c">2  Forward</text><text x="430.0" y="113.0" font-size="30" text-anchor="middle" fill="#20578c">raw logits</text><path d="M565,85 L582,85" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="20" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="720.0" y="75.5" font-size="30" text-anchor="middle" fill="#20578c">3  Mean loss</text><text x="720.0" y="113.0" font-size="30" text-anchor="middle" fill="#20578c">shifted targets</text><path d="M855,85 L872,85" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="880" y="20" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="1010.0" y="75.5" font-size="30" text-anchor="middle" fill="#20578c">4  Backward</text><text x="1010.0" y="113.0" font-size="30" text-anchor="middle" fill="#20578c">parameter grads</text><rect x="10" y="205" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="140.0" y="260.5" font-size="30" text-anchor="middle" fill="#20578c">5  Clip once</text><text x="140.0" y="298.0" font-size="30" text-anchor="middle" fill="#20578c">global norm</text><path d="M275,270 L292,270" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="205" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="430.0" y="260.5" font-size="30" text-anchor="middle" fill="#20578c">6  Set LR</text><text x="430.0" y="298.0" font-size="30" text-anchor="middle" fill="#20578c">for this update</text><path d="M565,270 L582,270" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="205" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="720.0" y="260.5" font-size="30" text-anchor="middle" fill="#20578c">7  Optimizer</text><text x="720.0" y="298.0" font-size="30" text-anchor="middle" fill="#20578c">changes weights</text><path d="M855,270 L872,270" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="880" y="205" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="1010.0" y="260.5" font-size="30" text-anchor="middle" fill="#20578c">8  Record</text><text x="1010.0" y="298.0" font-size="30" text-anchor="middle" fill="#20578c">completed update</text><text x="570.0" y="383.0" font-size="28" text-anchor="middle" fill="#566471">Accumulate microbatches before stages 5–8; clear once per update.</text></g></svg>
