<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>Compare 40 continuous updates with a fresh-process restart</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="135.0" y="32.0" font-size="30" text-anchor="middle" fill="#142e4b">0 updates</text><text x="575.0" y="32.0" font-size="30" text-anchor="middle" fill="#142e4b">20 updates</text><text x="1017.0" y="32.0" font-size="30" text-anchor="middle" fill="#142e4b">40 updates</text><text x="5" y="95.0" font-size="32" text-anchor="start" fill="#142e4b">Continuous</text><path d="M30,123 L1110,123" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="5" y="235.0" font-size="32" text-anchor="start" fill="#142e4b">Restarted</text><path d="M30,263 L1110,263" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="182" width="220" height="126" fill="#eef2f5" stroke="#28673f" stroke-width="2"/><text x="575.0" y="218.5" font-size="28" text-anchor="middle" fill="#28673f">Save</text><text x="575.0" y="253.5" font-size="28" text-anchor="middle" fill="#28673f">new process</text><text x="575.0" y="288.5" font-size="28" text-anchor="middle" fill="#28673f">restore</text><text x="575.0" y="372.0" font-size="30" text-anchor="middle" fill="#142e4b">Same initial state, future batches, LR schedule, and CPU environment.</text></g></svg>
