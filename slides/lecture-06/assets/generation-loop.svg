<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>Use final-position logits to append a token, then repeat</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="575.0" y="42.0" font-size="34" text-anchor="middle" fill="#142e4b">Prefix: Noa can be annoying but she is a great</text><rect x="10" y="126" width="255" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="137.5" y="181.5" font-size="30" text-anchor="middle" fill="#20578c">Causal model</text><text x="137.5" y="219.0" font-size="30" text-anchor="middle" fill="#20578c">last-position logits</text><rect x="340" y="126" width="205" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="442.5" y="181.5" font-size="30" text-anchor="middle" fill="#20578c">Choose</text><text x="442.5" y="219.0" font-size="30" text-anchor="middle" fill="#20578c">a token</text><rect x="620" y="126" width="200" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="720.0" y="181.5" font-size="30" text-anchor="middle" fill="#20578c">Append</text><text x="720.0" y="219.0" font-size="30" text-anchor="middle" fill="#20578c">cat</text><rect x="895" y="126" width="245" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="1017.5" y="181.5" font-size="30" text-anchor="middle" fill="#20578c">Next prefix</text><text x="1017.5" y="219.0" font-size="30" text-anchor="middle" fill="#20578c">repeat</text><path d="M273,190 L327,190" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><path d="M550,190 L607,190" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><path d="M830,190 L882,190" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="575.0" y="355.0" font-size="30" text-anchor="middle" fill="#566471">Stop at EOS or the token budget. The example token is illustrative.</text></g></svg>
