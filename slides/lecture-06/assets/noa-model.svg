<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>The exact 4608-parameter Noa teaching model</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="85" width="245" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="132.5" y="140.5" font-size="30" text-anchor="middle" fill="#20578c">Token + position</text><text x="132.5" y="178.0" font-size="30" text-anchor="middle" fill="#20578c">12 × 16 + 10 × 16</text><rect x="315" y="85" width="250" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="440.0" y="140.5" font-size="30" text-anchor="middle" fill="#20578c">2 pre-LN blocks</text><text x="440.0" y="178.0" font-size="30" text-anchor="middle" fill="#20578c">4 heads · FFN 32</text><rect x="625" y="85" width="200" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="725.0" y="140.5" font-size="30" text-anchor="middle" fill="#20578c">Final norm</text><text x="725.0" y="178.0" font-size="30" text-anchor="middle" fill="#20578c">width 16</text><rect x="885" y="85" width="250" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="1010.0" y="140.5" font-size="30" text-anchor="middle" fill="#20578c">Tied readout</text><text x="1010.0" y="178.0" font-size="30" text-anchor="middle" fill="#20578c">16 → 12 logits</text><path d="M258,150 L302,150" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><path d="M568,150 L612,150" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><path d="M828,150 L872,150" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="575.0" y="54.0" font-size="34" text-anchor="middle" fill="#142e4b">Noa can be annoying but she is a great cat EOS</text><text x="575.0" y="304.0" font-size="34" text-anchor="middle" fill="#28673f">4,608 unique parameters · context limit: 10 inputs</text><text x="575.0" y="360.0" font-size="28" text-anchor="middle" fill="#566471">ReLU · no Linear biases · no dropout · tied token/readout weights</text></g></svg>
