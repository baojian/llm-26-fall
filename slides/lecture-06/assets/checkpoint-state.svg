<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>The state needed to continue the next update</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="210.0" y="38.0" font-size="34" text-anchor="middle" fill="#142e4b">Training state</text><rect x="5" y="60" width="435" height="60" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="222.5" y="99.25" font-size="30" text-anchor="middle" fill="#20578c">Model parameters</text><rect x="5" y="136" width="435" height="60" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="222.5" y="175.25" font-size="30" text-anchor="middle" fill="#20578c">AdamW moments + step</text><rect x="5" y="212" width="435" height="60" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="222.5" y="251.25" font-size="30" text-anchor="middle" fill="#20578c">Completed updates + config</text><rect x="5" y="288" width="435" height="60" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="222.5" y="327.25" font-size="30" text-anchor="middle" fill="#20578c">RNG + sampler + data IDs</text><path d="M458,200 L590,200" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><rect x="610" y="115" width="235" height="175" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="727.5" y="172.5" font-size="32" text-anchor="middle" fill="#20578c">Save after</text><text x="727.5" y="212.5" font-size="32" text-anchor="middle" fill="#20578c">a complete</text><text x="727.5" y="252.5" font-size="32" text-anchor="middle" fill="#20578c">update</text><path d="M860,200 L955,200" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="958" y="155.0" font-size="30" text-anchor="start" fill="#142e4b">Next batch</text><text x="958" y="192.5" font-size="30" text-anchor="start" fill="#142e4b">Next LR</text><text x="958" y="230.0" font-size="30" text-anchor="start" fill="#142e4b">Next update</text></g></svg>
