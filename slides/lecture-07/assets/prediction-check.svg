<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>Fit on small runs, freeze, predict, then check a reserved run</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="141.0" y="87.0" font-size="32" text-anchor="middle" fill="#20578c">1  Small runs</text><rect x="6" y="120" width="270" height="140" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="141.0" y="180.5" font-size="30" text-anchor="middle" fill="#20578c">Fit the curve</text><text x="141.0" y="218.0" font-size="30" text-anchor="middle" fill="#20578c">Tune the recipe</text><path d="M279,190 L293,190" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="431.0" y="87.0" font-size="32" text-anchor="middle" fill="#634185">2  Freeze</text><rect x="296" y="120" width="270" height="140" fill="#eef2f5" stroke="#634185" stroke-width="2"/><text x="431.0" y="180.5" font-size="30" text-anchor="middle" fill="#634185">Recipe + curve</text><text x="431.0" y="218.0" font-size="30" text-anchor="middle" fill="#634185">Error tolerance</text><path d="M569,190 L583,190" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="721.0" y="87.0" font-size="32" text-anchor="middle" fill="#20578c">3  Predict</text><rect x="586" y="120" width="270" height="140" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="721.0" y="180.5" font-size="30" text-anchor="middle" fill="#20578c">Write the loss</text><text x="721.0" y="218.0" font-size="30" text-anchor="middle" fill="#20578c">at a larger budget</text><path d="M859,190 L873,190" fill="none" stroke="#20578c" stroke-width="3" marker-end="url(#arrow)"/><text x="1011.0" y="87.0" font-size="32" text-anchor="middle" fill="#28673f">4  Check</text><rect x="876" y="120" width="270" height="140" fill="#eef2f5" stroke="#28673f" stroke-width="2"/><text x="1011.0" y="180.5" font-size="30" text-anchor="middle" fill="#28673f">Reveal the run</text><text x="1011.0" y="218.0" font-size="30" text-anchor="middle" fill="#28673f">Compare the error</text><text x="575.0" y="350.0" font-size="32" text-anchor="middle" fill="#142e4b">The reserved larger run stays outside fitting and recipe selection.</text></g></svg>
