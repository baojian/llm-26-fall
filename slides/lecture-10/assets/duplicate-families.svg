<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="410" viewBox="0 0 1152 410" role="img"><title>Connected match families stay within a split without deleting every record</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#20578c"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="576.0" y="32.0" font-size="32" text-anchor="middle" fill="#142e4b">Match threshold: J ≥ 0.75</text><rect x="70" y="100" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="200.0" y="155.5" font-size="30" text-anchor="middle" fill="#20578c">A</text><text x="200.0" y="193.0" font-size="30" text-anchor="middle" fill="#20578c">{1, 2, 3, 4}</text><rect x="445" y="100" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="575.0" y="155.5" font-size="30" text-anchor="middle" fill="#20578c">B</text><text x="575.0" y="193.0" font-size="30" text-anchor="middle" fill="#20578c">{1, 2, 3, 4, 5}</text><rect x="820" y="100" width="260" height="130" fill="#eef2f5" stroke="#20578c" stroke-width="2"/><text x="950.0" y="155.5" font-size="30" text-anchor="middle" fill="#20578c">C</text><text x="950.0" y="193.0" font-size="30" text-anchor="middle" fill="#20578c">{2, 3, 4, 5}</text><path d="M335,165 L440,165" fill="none" stroke="#20578c" stroke-width="3"/><text x="387.5" y="83.0" font-size="28" text-anchor="middle" fill="#28673f">J = 0.8</text><path d="M710,165 L815,165" fill="none" stroke="#20578c" stroke-width="3"/><text x="762.5" y="83.0" font-size="28" text-anchor="middle" fill="#28673f">J = 0.8</text><text x="576.0" y="290.0" font-size="30" text-anchor="middle" fill="#566471">J(A, C) = 0.6: there is no direct A–C match.</text><rect x="70" y="330" width="1010" height="65" fill="#eef2f5" stroke="#28673f" stroke-width="2"/><text x="575.0" y="371.75" font-size="30" text-anchor="middle" fill="#28673f">One connected split group; inspect retention within the group.</text></g></svg>
